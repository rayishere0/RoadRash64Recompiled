pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}

rootProject.name = 'RoadRash64Recompiled'
include ':probe'
include ':app'
// The probe stays buildable alongside the game. The real LauncherActivity
// (ROM picker/import) is not in ':app' yet — the manifest launches
// GameActivity directly until it lands (see docs/ANDROID_GAME_BUILD.md).
